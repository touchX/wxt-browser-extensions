<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WXT Extension</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        padding: 16px;
        min-width: 280px;
        background: #f9fafb;
      }
      h1 { font-size: 16px; margin-bottom: 12px; color: #111827; }
      .section { margin-bottom: 16px; }
      .section-title { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
      .status {
        padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px;
      }
      .status.success { background: #d1fae5; color: #065f46; }
      .status.error { background: #fee2e2; color: #991b1b; }
      .status.loading { background: #dbeafe; color: #1e40af; }
      .btn {
        width: 100%; padding: 10px; background: #2563eb; color: white;
        border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
        margin-bottom: 8px;
      }
      .btn:hover { background: #1d4ed8; }
      .btn-secondary {
        background: #f3f4f6;
        color: #374151;
      }
      .btn-secondary:hover { background: #e5e7eb; }
      .btn-row { display: flex; gap: 8px; }
      .btn-row .btn { flex: 1; }
    </style>
  </head>
  <body>
    <h1>WXT 浏览器扩展</h1>

    <!-- 服务器状态 -->
    <div class="section">
      <div class="section-title">服务器状态</div>
      <div class="status" id="status">点击按钮检查服务器状态</div>
      <button class="btn" id="checkBtn">检查服务器</button>
    </div>

    <!-- WebClient 控制 -->
    <div class="section">
      <div class="section-title">WebClient 控制</div>
      <button class="btn btn-secondary" id="refreshBtn">刷新数据</button>
      <button class="btn btn-secondary" id="openSettingsBtn">打开设置</button>
      <button class="btn btn-secondary" id="syncBtn">同步状态</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
