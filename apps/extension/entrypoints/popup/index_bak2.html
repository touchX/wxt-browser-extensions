<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WXT Extension</title>
    <style>
      /* ===== Design Tokens ===== */
      :root {
        --c-primary: #6366f1;
        --c-primary-light: #818cf8;
        --c-primary-dark: #4f46e5;
        --c-gradient-start: #4f46e5;
        --c-gradient-end: #7c3aed;
        --c-bg: #f8fafc;
        --c-surface: #ffffff;
        --c-text-primary: #0f172a;
        --c-text-secondary: #64748b;
        --c-text-muted: #94a3b8;
        --c-border: #e2e8f0;
        --c-success: #10b981;
        --c-success-bg: #ecfdf5;
        --c-success-border: #a7f3d0;
        --c-error: #ef4444;
        --c-error-bg: #fef2f2;
        --c-error-border: #fecaca;
        --c-loading: #3b82f6;
        --c-loading-bg: #eff6ff;
        --c-loading-border: #bfdbfe;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ===== Reset ===== */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
        width: 340px;
        background: var(--c-bg);
        color: var(--c-text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      /* ===== Header ===== */
      .header {
        position: relative;
        background: linear-gradient(135deg, var(--c-gradient-start), var(--c-gradient-end));
        padding: 20px 20px 24px;
        overflow: hidden;
      }

      .header::before {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }

      .header::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 40%;
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }

      .header-content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        flex-shrink: 0;
      }

      .logo svg {
        width: 22px;
        height: 22px;
        color: white;
      }

      .header-text h1 {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .header-text p {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.65);
        margin-top: 2px;
        font-weight: 400;
      }

      /* ===== Content ===== */
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ===== Card ===== */
      .card {
        background: var(--c-surface);
        border-radius: var(--radius-md);
        border: 1px solid var(--c-border);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: box-shadow var(--transition-fast);
      }

      .card:hover {
        box-shadow: var(--shadow-md);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 0;
      }

      .card-header-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .card-header-icon svg {
        width: 14px;
        height: 14px;
      }

      .card-header-icon.server {
        background: #eef2ff;
        color: var(--c-primary);
      }

      .card-header-icon.control {
        background: #fdf4ff;
        color: #a855f7;
      }

      .card-header-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--c-text-primary);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .card-body {
        padding: 12px 16px 16px;
      }

      /* ===== Status ===== */
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        transition: all var(--transition-normal);
        border: 1px solid transparent;
        margin-bottom: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        transition: all var(--transition-normal);
      }

      .status.idle {
        background: #f1f5f9;
        color: var(--c-text-secondary);
        border-color: var(--c-border);
      }

      .status.idle .status-dot {
        background: var(--c-text-muted);
      }

      .status.loading {
        background: var(--c-loading-bg);
        color: var(--c-loading);
        border-color: var(--c-loading-border);
      }

      .status.loading .status-dot {
        background: var(--c-loading);
        animation: pulse 1.2s ease-in-out infinite;
      }

      .status.success {
        background: var(--c-success-bg);
        color: #065f46;
        border-color: var(--c-success-border);
      }

      .status.success .status-dot {
        background: var(--c-success);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      }

      .status.error {
        background: var(--c-error-bg);
        color: #991b1b;
        border-color: var(--c-error-border);
      }

      .status.error .status-dot {
        background: var(--c-error);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }

      /* ===== Primary Button ===== */
      .btn-primary {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        background: linear-gradient(135deg, var(--c-gradient-start), var(--c-gradient-end));
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        letter-spacing: 0.01em;
        position: relative;
        overflow: hidden;
      }

      .btn-primary::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }

      .btn-primary:hover::before {
        opacity: 1;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      }

      .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 1px 3px rgba(99, 102, 241, 0.25);
      }

      .btn-primary svg {
        width: 15px;
        height: 15px;
      }

      /* ===== Action Grid ===== */
      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 12px 8px;
        background: transparent;
        border: 1px solid var(--c-border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        color: var(--c-text-primary);
      }

      .action-btn:hover {
        background: #f8fafc;
        border-color: var(--c-primary-light);
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }

      .action-btn:active {
        transform: translateY(0);
        background: #f1f5f9;
      }

      .action-btn-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-fast);
      }

      .action-btn:hover .action-btn-icon {
        transform: scale(1.08);
      }

      .action-btn-icon.refresh {
        background: #ecfdf5;
        color: var(--c-success);
      }

      .action-btn-icon.settings {
        background: #eef2ff;
        color: var(--c-primary);
      }

      .action-btn-icon.sync {
        background: #fdf4ff;
        color: #a855f7;
      }

      .action-btn-icon svg {
        width: 16px;
        height: 16px;
      }

      .action-btn-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--c-text-secondary);
        white-space: nowrap;
      }

      .action-btn:hover .action-btn-label {
        color: var(--c-text-primary);
      }

      /* ===== Footer ===== */
      .footer {
        padding: 8px 16px 12px;
        text-align: center;
      }

      .footer-text {
        font-size: 10px;
        color: var(--c-text-muted);
        letter-spacing: 0.02em;
      }

      /* ===== Spinner ===== */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spinner {
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>WXT 浏览器扩展</h1>
          <p>Browser Extension v1.0</p>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="content">
      <!-- Server Status Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon server">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
              <line x1="6" y1="6" x2="6.01" y2="6"/>
              <line x1="6" y1="18" x2="6.01" y2="18"/>
            </svg>
          </div>
          <span class="card-header-title">服务器状态</span>
        </div>
        <div class="card-body">
          <div class="status idle" id="status">
            <span class="status-dot"></span>
            <span id="statusText">点击按钮检查服务器状态</span>
          </div>
          <button class="btn-primary" id="checkBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="checkBtnIcon">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span>检查服务器</span>
          </button>
        </div>
      </div>

      <!-- WebClient Control Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon control">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <span class="card-header-title">WebClient 控制</span>
        </div>
        <div class="card-body">
          <div class="action-grid">
            <button class="action-btn" id="refreshBtn">
              <div class="action-btn-icon refresh">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="23 4 23 10 17 10"/>
                  <polyline points="1 20 1 14 7 14"/>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
              </div>
              <span class="action-btn-label">刷新数据</span>
            </button>
            <button class="action-btn" id="openSettingsBtn">
              <div class="action-btn-icon settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </div>
              <span class="action-btn-label">打开设置</span>
            </button>
            <button class="action-btn" id="syncBtn">
              <div class="action-btn-icon sync">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
              </div>
              <span class="action-btn-label">同步状态</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-text">WXT Extension v1.0.0</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
