<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>健康体检数据</title>
    <style>
      /* ===== Design Tokens ===== */
      :root {
        --c-primary: #6366f1;
        --c-primary-light: #818cf8;
        --c-gradient-start: #4f46e5;
        --c-gradient-end: #7c3aed;
        --c-teal: #0d9488;
        --c-teal-light: #ccfbf1;
        --c-rose: #e11d48;
        --c-rose-light: #ffe4e6;
        --c-amber: #d97706;
        --c-amber-light: #fef3c7;
        --c-bg: #f8fafc;
        --c-surface: #ffffff;
        --c-text-primary: #0f172a;
        --c-text-secondary: #64748b;
        --c-text-muted: #94a3b8;
        --c-border: #e2e8f0;
        --radius-sm: 8px;
        --radius-md: 12px;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
        width: 360px;
        max-height: 580px;
        background: var(--c-bg);
        color: var(--c-text-primary);
        -webkit-font-smoothing: antialiased;
        overflow-y: auto;
      }

      /* ===== Header ===== */
      .header {
        position: relative;
        background: linear-gradient(135deg, var(--c-gradient-start), var(--c-gradient-end));
        padding: 20px 20px 22px;
        overflow: hidden;
      }

      .header::before {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 120px;
        height: 120px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
      }

      .header::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 40%;
        width: 80px;
        height: 80px;
        background: rgba(255,255,255,0.05);
        border-radius: 50%;
      }

      .header-content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.18);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.12);
        flex-shrink: 0;
      }

      .logo svg { width: 22px; height: 22px; color: white; }

      .header-text h1 {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .header-text p {
        font-size: 11px;
        color: rgba(255,255,255,0.6);
        margin-top: 2px;
      }

      /* ===== Tab Navigation ===== */
      .tab-nav {
        display: flex;
        background: var(--c-surface);
        border-bottom: 1px solid var(--c-border);
        padding: 0 12px;
      }

      .tab-btn {
        flex: 1;
        padding: 10px 8px;
        border: none;
        background: none;
        font-size: 11px;
        font-weight: 500;
        color: var(--c-text-secondary);
        cursor: pointer;
        position: relative;
        transition: color var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .tab-btn:hover { color: var(--c-primary); }

      .tab-btn.active {
        color: var(--c-primary);
        font-weight: 600;
      }

      .tab-btn.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--c-primary);
        border-radius: 2px 2px 0 0;
      }

      .tab-btn-icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      /* ===== Tab Content ===== */
      .tab-content {
        display: none;
        padding: 12px;
      }

      .tab-content.active { display: block; }

      /* ===== Card ===== */
      .card {
        background: var(--c-surface);
        border-radius: var(--radius-md);
        border: 1px solid var(--c-border);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: box-shadow var(--transition-fast);
      }

      .card:hover { box-shadow: var(--shadow-md); }

      .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 0;
      }

      .card-header-icon {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .card-header-icon svg { width: 13px; height: 13px; }

      .card-header-icon.basic {
        background: var(--c-teal-light);
        color: var(--c-teal);
      }

      .card-header-icon.bp {
        background: var(--c-rose-light);
        color: var(--c-rose);
      }

      .card-header-icon.bs {
        background: var(--c-amber-light);
        color: var(--c-amber);
      }

      .card-header-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--c-text-primary);
        letter-spacing: 0.01em;
      }

      .card-body {
        padding: 10px 14px 14px;
      }

      /* ===== Data Grid ===== */
      .data-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }

      .data-grid.single-col {
        grid-template-columns: 1fr;
      }

      .data-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 0;
      }

      .data-item.full-width {
        grid-column: 1 / -1;
      }

      .data-label {
        font-size: 10px;
        color: var(--c-text-muted);
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .data-value {
        font-size: 13px;
        color: var(--c-text-primary);
        font-weight: 500;
        min-height: 20px;
        padding: 2px 8px;
        background: #f8fafc;
        border: 1px solid #f1f5f9;
        border-radius: 6px;
        transition: all var(--transition-fast);
      }

      .data-value:hover {
        border-color: var(--c-primary-light);
        background: #eef2ff;
      }

      .data-value:empty::after {
        content: '-';
        color: var(--c-text-muted);
      }

      /* ===== Action Bar ===== */
      .action-bar {
        padding: 0 12px 10px;
        display: flex;
        gap: 8px;
      }

      .action-btn {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--c-border);
        border-radius: var(--radius-sm);
        background: var(--c-surface);
        font-size: 11px;
        font-weight: 500;
        color: var(--c-text-primary);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: var(--shadow-sm);
      }

      .action-btn:hover {
        border-color: var(--c-primary);
        color: var(--c-primary);
        background: #eef2ff;
      }

      .action-btn:active {
        transform: scale(0.97);
      }

      .action-btn.loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .action-btn svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }

      /* ===== Status Toast ===== */
      .toast {
        margin: 0 12px 8px;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 500;
        display: none;
        align-items: center;
        gap: 4px;
      }

      .toast.visible { display: flex; }

      .toast.success {
        background: var(--c-teal-light);
        color: var(--c-teal);
      }

      .toast.error {
        background: var(--c-rose-light);
        color: var(--c-rose);
      }

      /* ===== Footer ===== */
      .footer {
        padding: 6px 16px 10px;
        text-align: center;
      }

      .footer-text {
        font-size: 10px;
        color: var(--c-text-muted);
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <!-- Heart/Health icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>健康体检数据</h1>
          <p>Health Examination</p>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="basic">
        <svg class="tab-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        基础
      </button>
      <button class="tab-btn" data-tab="bp">
        <svg class="tab-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        血压
      </button>
      <button class="tab-btn" data-tab="bs">
        <svg class="tab-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        血糖
      </button>
    </nav>

    <!-- Tab Panels -->
    <div class="tab-panels">
      <!-- 基础信息 -->
      <div class="tab-content active" id="panel-basic">
        <div class="card">
          <div class="card-header">
            <div class="card-header-icon basic">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <span class="card-header-title">基础信息</span>
          </div>
          <div class="card-body">
            <div class="data-grid">
              <div class="data-item">
                <span class="data-label">姓名</span>
                <div class="data-value" id="name"></div>
              </div>
              <div class="data-item">
                <span class="data-label">性别</span>
                <div class="data-value" id="gender"></div>
              </div>
              <div class="data-item">
                <span class="data-label">年龄</span>
                <div class="data-value" id="age"></div>
              </div>
              <div class="data-item">
                <span class="data-label">登记号</span>
                <div class="data-value" id="regNo"></div>
              </div>
              <div class="data-item full-width">
                <span class="data-label">身份证号</span>
                <div class="data-value" id="idCard"></div>
              </div>
              <div class="data-item">
                <span class="data-label">检查日期</span>
                <div class="data-value" id="checkDate"></div>
              </div>
              <div class="data-item">
                <span class="data-label">身高(cm)</span>
                <div class="data-value" id="height"></div>
              </div>
              <div class="data-item">
                <span class="data-label">体重(kg)</span>
                <div class="data-value" id="weight"></div>
              </div>
              <div class="data-item">
                <span class="data-label">腰围(cm)</span>
                <div class="data-value" id="waist"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 血压心率 -->
      <div class="tab-content" id="panel-bp">
        <div class="card">
          <div class="card-header">
            <div class="card-header-icon bp">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
            </div>
            <span class="card-header-title">血压心率</span>
          </div>
          <div class="card-body">
            <div class="data-grid">
              <div class="data-item">
                <span class="data-label">左收缩压</span>
                <div class="data-value" id="leftSystolic"></div>
              </div>
              <div class="data-item">
                <span class="data-label">左舒张压</span>
                <div class="data-value" id="leftDiastolic"></div>
              </div>
              <div class="data-item">
                <span class="data-label">右收缩压</span>
                <div class="data-value" id="rightSystolic"></div>
              </div>
              <div class="data-item">
                <span class="data-label">右舒张压</span>
                <div class="data-value" id="rightDiastolic"></div>
              </div>
              <div class="data-item full-width">
                <span class="data-label">脉率</span>
                <div class="data-value" id="pulseRate"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 血糖指标 -->
      <div class="tab-content" id="panel-bs">
        <div class="card">
          <div class="card-header">
            <div class="card-header-icon bs">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <span class="card-header-title">血糖指标</span>
          </div>
          <div class="card-body">
            <div class="data-grid single-col">
              <div class="data-item">
                <span class="data-label">空腹血糖</span>
                <div class="data-value" id="fastingGlucose"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button class="action-btn" id="btnExtractId">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M14 8h2"/><path d="M14 12h2"/></svg>
        获取患者信息
      </button>
      <button class="action-btn" id="btnFetchData">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
        获取患者数据
      </button>
      <button class="action-btn" id="btnShowData">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
        插入患者数据
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-text">Health Exam Extension v1.0</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
