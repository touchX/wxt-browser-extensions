<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WXT Extension</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        padding: 16px;
        min-width: 280px;
        background: #f9fafb;
      }
      h1 { font-size: 16px; margin-bottom: 12px; color: #111827; }
      .status {
        padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px;
      }
      .status.success { background: #d1fae5; color: #065f46; }
      .status.error { background: #fee2e2; color: #991b1b; }
      .status.loading { background: #dbeafe; color: #1e40af; }
      .btn {
        width: 100%; padding: 10px; background: #2563eb; color: white;
        border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
      }
      .btn:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <h1>WXT 浏览器扩展</h1>
    <div class="status" id="status">点击按钮检查服务器状态</div>
    <button class="btn" id="checkBtn">检查服务器</button>

    <script>
      const statusEl = document.getElementById('status');
      const checkBtn = document.getElementById('checkBtn');

      checkBtn.addEventListener('click', async () => {
        statusEl.textContent = '检查中...';
        statusEl.className = 'status loading';

        try {
          const res = await fetch('http://localhost:3000/health');
          const data = await res.json();
          statusEl.textContent = `服务器: ${data.status}`;
          statusEl.className = data.status === 'ok' ? 'status success' : 'status error';
        } catch (e) {
          statusEl.textContent = '服务器: 无法连接';
          statusEl.className = 'status error';
        }
      });
    </script>
  </body>
</html>
